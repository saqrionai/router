[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-orchestrator"
version = "0.14.2"
description = "Evidence-driven multi-model orchestration for authorized security research and engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
dependencies = []

[project.scripts]
orch = "orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
